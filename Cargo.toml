[workspace]
members = ["verifier"]

# We need to explicitly specify resolver 2.
# We shouldn't have to per https://doc.rust-lang.org/edition-guide/rust-2021/default-cargo-resolver.html, but that does not appear to be the case
resolver = "2"

[workspace.package]
authors = ["MobileCoin"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mobilecoinfoundation/attestation"
rust-version = "1.99"

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
pre-release-replacements = [
    # Files listed here must exist in all crates in this workspace
    { file = "README.md", search = "mc-attestation-[a-z-]+/[0-9.]+", replace = "{{crate_name}}/{{version}}" },
]

[profile.release]
lto = "thin"

[patch.crates-io]
# mbedtls patched to allow certificate verification with a profile
mbedtls = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }
mbedtls-sys-auto = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }
# Use SGX SDK 2.30.1 / DCAP 1.27.1 from mobilecoinfoundation/sgx#505.
mc-sgx-core-sys-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "c8900e5ee5bc58c37aecb44ab97412986d972898" }
mc-sgx-core-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "c8900e5ee5bc58c37aecb44ab97412986d972898" }
mc-sgx-dcap-sys-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "c8900e5ee5bc58c37aecb44ab97412986d972898" }
mc-sgx-dcap-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "c8900e5ee5bc58c37aecb44ab97412986d972898" }
